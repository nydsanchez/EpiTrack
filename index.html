<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Registro de movimientos</title>

<style>
:root{--bg:#f1f5f9;--card:#ffffff;--ink:#0f172a;--mut:#64748b;--pri:#0f766e;--pri2:#14b8a6;--red:#dc2626;--redbg:#fee2e2;--amb:#d97706;--ambbg:#fef3c7;--blue:#2563eb;--line:#e2e8f0;--gray:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
#app{max-width:660px;margin:0 auto;padding:12px 12px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
header.top h1{font-size:19px;margin:0}
header.top .sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--pri)}
.card h3{font-size:14px;margin:12px 0 6px}
.mut{color:var(--mut);font-size:13px}
.small{font-size:13px}
.banner{background:var(--ambbg);border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner.red{background:var(--redbg);border-color:#fca5a5;color:#991b1b}
.bignum{font-size:44px;font-weight:800;line-height:1}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat{background:var(--bg);border-radius:10px;padding:6px 10px;font-size:13px}
.stat b{font-size:16px}
.stat.red{background:var(--redbg);color:#991b1b}
button{font:inherit;border:none;border-radius:12px;cursor:pointer;background:var(--bg);color:var(--ink);padding:10px 14px}
button:active{transform:scale(.98)}
.btn{background:var(--pri);color:#fff;font-weight:600}
.btn.sec{background:#e2e8f0;color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.biglog{width:100%;padding:22px 16px;font-size:21px;font-weight:800;border-radius:18px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.35);margin:4px 0 10px}
.biglog small{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:4px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:9px;padding:10px 6px;font-weight:600;background:transparent;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border-radius:999px;padding:8px 13px;font-size:14px;background:#eef2f7;border:1.5px solid transparent}
.chip.on{background:var(--pri);color:#fff;font-weight:600}
.chip.on.red{background:var(--red)}
.chip.on.amb{background:var(--amb)}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:10px 0 2px}
.ev{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
.ev.fuerte{border-left-color:var(--red);background:#fff5f5}
.ev.leve{border-left-color:var(--amb)}
.ev.visible{border-left-color:var(--blue)}
.ev .h{font-weight:800;font-size:16px;min-width:52px}
.ev .p{font-size:14px}
.badge{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#e2e8f0;color:#334155}
.badge.red{background:var(--redbg);color:#991b1b}
.badge.amb{background:var(--ambbg);color:#92400e}
.badge.teal{background:#ccfbf1;color:#115e59}
.badge.blue{background:#dbeafe;color:#1e40af}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom .wrap{max-width:660px;margin:0 auto;display:flex;width:100%}
nav.bottom button{flex:1;background:transparent;border-radius:0;padding:9px 2px 7px;font-size:11px;color:var(--mut);font-weight:600}
nav.bottom button .ic{display:block;font-size:21px;line-height:1.2}
nav.bottom button.on{color:var(--pri)}
#sheetWrap{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:none}
#sheetWrap.open{display:block}
#sheet{position:absolute;bottom:0;left:0;right:0;max-width:660px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;max-height:88vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet .grab{width:44px;height:5px;background:#cbd5e1;border-radius:3px;margin:0 auto 10px}
#modalWrap{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:14px}
#modalWrap.open{display:flex}
#modal{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:86vh;overflow-y:auto;padding:16px}
textarea,input,select{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
input[type=time],input[type=date]{width:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.row .fix{flex:0 0 auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;display:none;max-width:90%;text-align:center}
.helpbox{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.helpbox.red{background:var(--redbg);border-color:#fca5a5}
.helpbox ul{margin:6px 0;padding-left:20px}
.helpbox li{margin:4px 0}
.daychips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
svg text{font-family:system-ui,sans-serif}
#printArea{display:none}
@media print{
 body{background:#fff}
 #app,nav.bottom,#sheetWrap,#modalWrap,#toast{display:none!important}
 #printArea{display:block;font-size:12px}
 #printArea table{font-size:11px}
 #printArea h1{font-size:18px}
 #printArea h2{font-size:14px;margin:14px 0 6px}
}
</style>
</head>

function parseLista(text,fecha,obs,estado){

  L.push('');L.push('— Por semana (lun–dom) —');

  for(const s of semanas){L.push('S'+s.iso+' ('+fechaCorta(s.lunes)+') · '+s.diasRegistrados+'/7 · '+s.total+' · '+s.promDia.toFixed(1)+' · '+fmtTasa(s.tasa)+' · '+s.fuertes);}
 }
 const ph=[];g.porHora.forEach((n,h)=>{if(n)ph.push(h+'h: '+n);});
 if(ph.length){L.push('');L.push('Horas pico (todos los días): '+ph.join(' · '));}
 L.push('');L.push('Frecuencia = eventos por día y por hora. Ventana = horario observado (o primer→último evento si no se indicó).');
 return L.join('\n');
}
function resumenDia(fecha,evs,ctx,nombre){
 const st=statsDia(evs);
 const L=[];
 L.push('📋 '+(nombre||'Registro de movimientos')+' — '+fechaLarga(fecha));
 if(ctx&&ctx.ml)L.push('💊 Keppra: '+ctx.ml+' mL por toma × '+(ctx.tomas||'?')+' tomas/día');
 L.push('Total: '+st.total+' eventos'+(st.horaMin?' ('+st.horaMin+'–'+st.horaMax+')':''));
 L.push('Fuertes: '+st.fuertes+' · Generalizados: '+st.general+' · Ojos abiertos: '+st.ojos+' · Despierta: '+st.despierta);
 const fd=frecDia(evs,ctx);
 if(fd.tasa!=null)L.push('Frecuencia: '+fmtTasa(fd.tasa)+' eventos/hora (ventana '+fd.ventana+(fd.obsReal?', observada':'')+')'+(fd.intervalo!=null?' · intervalo medio '+fd.intervalo.toFixed(1)+' min':''));
 const ph=[];st.porHora.forEach((n,h)=>{if(n)ph.push(h+'h: '+n);});
 if(ph.length)L.push('Por hora: '+ph.join(' · '));
 L.push('');L.push('— Detalle —');
 const sorted=evs.slice().sort((a,b)=>a.hora<b.hora?-1:1);
 for(const e of sorted){
  let s=e.hora+(e.horaFin?'–'+e.horaFin:'')+' '+(e.partes.join('+')||'movimiento sutil');
  if(e.lado)s+=' ('+ladoAbbr(e.lado)+')';
  if(e.intensidad)s+=' · '+e.intensidad.toLowerCase();
  s+=' · '+(e.estado==='Despierta'?'DESPIERTA':e.estado==='Dormida'?'dormida':'estado s/d');
  if(e.dur)s+=' · '+durLabel(e.dur);
  if(e.ojos)s+=' 👀';
  if(e.habla)s+=' 🗣';
  if(e.varios)s+=' (varios seguidos)';
  if(e.revisar)s+=' 🎥';
  L.push(s);
 }
 const rev=sorted.filter(e=>e.revisar).map(e=>e.hora);
 if(rev.length){L.push('');L.push('🎥 Revisar/guardar video: '+rev.join(', '));}
 if(ctx&&ctx.notas){L.push('');L.push('Notas del día: '+ctx.notas);}
 return L.join('\n');
}

function helpHtml(){
 return '<div class="helpbox"><b>Qué registrar</b><ul><li><b>Cada movimiento</b>, aunque sea sutil: un toque al botón grande guarda la hora exacta. Los detalles son opcionales.</li><li><b>Duración:</b> para eventos de segundos no hace falta el dato exacto — usen rangos (&lt;5 s, 5–15 s…) o déjenlo vacío. Para el médico, la <b>frecuencia, los racimos y las partes del cuerpo</b> importan más que los segundos exactos.</li><li><b>Varios seguidos:</b> si en un minuto hay varios movimientos, marquen “Varios seguidos”.</li><li><b>Despierta:</b> anoten lo que la niña diga (“me tembló la pierna”) en la nota.</li></ul></div>'
 +'<div class="helpbox"><b>🎥 Videos (muy útiles para el neurólogo)</b><ul><li>Luz encendida, que se vean <b>cara y cuerpo completo</b>; narrar en voz alta lo que se ve.</li><li>Grabar hasta que termine y cómo queda después (si responde, habla, se vuelve a dormir).</li><li>Anotar la hora del video y <b>sincronizar el reloj de la cámara con el celular</b> (suelen diferir).</li><li>Los eventos marcados 🎥 son los que conviene revisar/guardar.</li></ul></div>'
 +'<div class="helpbox red"><b>⚠️ Cuándo buscar ayuda urgente</b><ul><li>Un evento que dura <b>más de 5 minutos</b>.</li><li>Varios eventos seguidos <b>sin recuperarse entre ellos</b>.</li><li>Dificultad para respirar, labios o cara morados.</li><li>No responde o no despierta como siempre después del evento.</li><li>Se lastima durante un evento.</li></ul><b>→ Llamen a emergencias / acudan a urgencias.</b> Y avisen al neurólogo <b>pronto</b> (sin esperar la próxima cita) por el cambio de patrón: más frecuentes, nuevas partes del cuerpo y episodios despierta. <b>No suspendan ni bajen el Keppra por su cuenta.</b></div>'
 +'<div class="helpbox"><b>👨‍👩‍👧 En familia</b><ul><li>Cada persona registra en su celular eligiendo su nombre de observador, o todos anotan en un solo teléfono (el que mira la cámara).</li><li>Al final del día: exportar CSV → una persona importa los demás, o peguen las listas de WhatsApp en “Pegar lista”.</li><li>Para la cita: “Informe médico” (imprimir/PDF) + el CSV + los videos de los eventos 🎥.</li></ul></div>';
}

  h+='</table><p style="font-size:10px;color:#555">Semanas ISO de lunes a domingo. El promedio de eventos/día usa solo los días con registro. Δ% compara eventos/hora con la semana anterior.</p>';
 }
 h+='<h2>Horas pico (suma de todos los días)</h2><table><tr>'+g.porHora.map((n,i)=>n?'<th>'+i+'h</th>':'').join('')+'</tr><tr>'+g.porHora.map(n=>n?'<td><b>'+n+'</b></td>':'').join('')+'</tr></table>';
 const rank=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
 h+='<h2>Frecuencia por parte del cuerpo</h2><table><tr>'+rank(g.porParte).map(kv=>'<th>'+esc(kv[0])+'</th>').join('')+'</tr><tr>'+rank(g.porParte).map(kv=>'<td><b>'+kv[1]+'</b></td>').join('')+'</tr></table>';
 h+='<p style="font-size:10px;color:#555">* Ventana estimada como primer→último evento del día (no se indicó horario observado). Tasa eventos/hora = eventos ÷ horas de la ventana. Registro familiar; en eventos de segundos se priorizó hora y frecuencia sobre duración exacta.</p>';
 document.getElementById('printArea').innerHTML=h;
}

/* ---------- acciones ---------- */
function addEvent(e){normalizeEv(e);if(!e.id)e.id=genId();S.eventos.push(e);save();return e;}
function download(name,content,mime){
 try{const blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},500);toast('Descargando '+name);}
 catch(err){toast('No se pudo descargar aquí. Abre la app fuera de la vista previa.');}
}
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t)return;
 const act=t.dataset.act;
 const cur=ui.sheetId?evById(ui.sheetId):null;
 switch(act){
  case 'tab':ui.tab=t.dataset.tab;render();window.scrollTo(0,0);break;
  case 'instalar':instalarApp();break;
  case 'introOk':S.ajustes.introVista=true;save();render();break;
  case 'defEstado':S.ajustes.estadoDefault=t.dataset.val;save();render();break;
  case 'quickLog':{const e=addEvent(newEv(todayStr(),nowHM(),S.ajustes.obsActivo,S.ajustes.estadoDefault));e.fuente='App';save();ui.sheetId=e.id;render();toast('Registrado '+e.hora+' ✓');break;}
  case 'pastEvent':{const e=newEv(todayStr(),nowHM(),S.ajustes.obsActivo,S.ajustes.estadoDefault);e.fuente='App (hora manual)';addEvent(e);ui.sheetId=e.id;render();toast('Ajusten la hora del evento');break;}
  case 'openEv':ui.sheetId=t.dataset.id;renderSheet();break;
  case 'closeSheet':ui.sheetId=null;render();break;
  case 'chipPart':{if(!cur)break;const p=t.dataset.val;const i=cur.partes.indexOf(p);
   if(p==='Generalizado'){cur.partes=i>=0?[]:['Generalizado'];}
   else{cur.partes=cur.partes.filter(x=>x!=='Generalizado');const j=cur.partes.indexOf(p);if(j>=0)cur.partes.splice(j,1);else cur.partes.push(p);}
   normalizeEv(cur);save();renderSheet();break;}
  case 'chipLado':if(cur){cur.lado=cur.lado===t.dataset.val?'':t.dataset.val;save();renderSheet();}break;
  case 'chipInt':if(cur){cur.intensidad=cur.intensidad===t.dataset.val?'':t.dataset.val;normalizeEv(cur);save();renderSheet();}break;
  case 'chipTipo':if(cur){cur.tipo=cur.tipo===t.dataset.val?'':t.dataset.val;save();renderSheet();}break;
  case 'chipDur':if(cur){cur.dur=cur.dur===t.dataset.val?'':t.dataset.val;save();renderSheet();}break;
  case 'chipEstado':if(cur){cur.estado=t.dataset.val;save();renderSheet();}break;
  case 'tog':if(cur){const k=t.dataset.key;cur[k]=!cur[k];save();renderSheet();}break;
  case 'delEv':{const id=t.dataset.id;if(confirm('¿Borrar este evento?')){S.eventos=S.eventos.filter(e=>e.id!==id);save();ui.sheetId=null;render();toast('Evento borrado');}break;}
  case 'selDay':ui.selDay=t.dataset.day;ui.tab='hist';render();break;
  case 'goHist':ui.selDay=t.dataset.day;ui.tab='hist';render();window.scrollTo(0,0);break;
  case 'ctxSave':{const f=t.dataset.day;setCtx(f,{sueno:document.getElementById('ctx-sueno').value,animo:document.getElementById('ctx-animo').value,notas:document.getElementById('ctx-notas').value,obsDesde:document.getElementById('ctx-desde').value,obsHasta:document.getElementById('ctx-hasta').value});toast('Contexto guardado ✓');render();break;}
  case 'saveMgPeso':S.ajustes.mgml=document.getElementById('aj-mgml').value;S.ajustes.peso=document.getElementById('aj-peso').value;save();toast('Guardado ✓');render();break;
  case 'addDose':{const f=document.getElementById('dose-fecha').value;const ml=document.getElementById('dose-ml').value;const tomas=document.getElementById('dose-tomas').value;if(!f||!ml){toast('Completa fecha y mL');break;}setCtx(f,{ml:ml,tomas:tomas});toast('Dosis guardada ✓');render();break;}
  case 'exportCSV':download('eventos_'+todayStr()+'.csv',toCSV(S.eventos.slice().sort((a,b)=>(a.fecha+a.hora)<(b.fecha+b.hora)?-1:1)),'text/csv;charset=utf-8');break;
  case 'exportDias':{const rows=['fecha;ml_por_toma;tomas_dia;sueno_h;animo_1a5;notas'];Object.keys(S.contexto).sort().forEach(f=>{const c=S.contexto[f];rows.push([f,c.ml||'',c.tomas||'',c.sueno||'',c.animo||'',csvEsc(c.notas||'')].join(';'));});download('dias_dosis_'+todayStr()+'.csv','﻿'+rows.join('\n'),'text/csv;charset=utf-8');break;}
  case 'exportJSON':download('respaldo_registro_'+todayStr()+'.json',JSON.stringify(S,null,1),'application/json');break;
  case 'importFile':document.getElementById('fileIn').click();break;
  case 'waSummary':{const f=t.dataset.day||todayStr();ui.waText=resumenDia(f,evsDia(f),getCtx(f),S.ajustes.nombre);ui.modal='wa';renderModal();break;}
  case 'waFrec':ui.waText=resumenFrecuencia(frecGlobal(S.eventos,S.contexto),S.ajustes.nombre,frecSemanas(S.eventos,S.contexto));ui.modal='wa';renderModal();break;
  case 'copyModal':{const ta=document.getElementById('waText');ta.select();ta.setSelectionRange(0,999999);let ok=false;try{ok=document.execCommand('copy');}catch(e){}
   if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(()=>toast('Copiado ✓')).catch(()=>toast(ok?'Copiado ✓':'Seleccionado: mantén presionado y copia'));}
   else toast(ok?'Copiado ✓':'Seleccionado: mantén presionado y copia');break;}
  case 'closeModal':ui.modal=null;ui.parseRows=null;renderModal();break;
  case 'parsePreview':{const txt=document.getElementById('parse-text').value;const f=document.getElementById('parse-fecha').value||todayStr();if(!txt.trim()){toast('Pega el texto primero');break;}
   ui.parseRows=parseLista(txt,f,S.ajustes.obsActivo,S.ajustes.estadoDefault).map(normalizeEv);ui.parseFecha=f;
   if(!ui.parseRows.length){toast('No se encontraron horas (ej. 8:05)');break;}
   ui.modal='parse';renderModal();break;}
  case 'parseDel':ui.parseRows.splice(+t.dataset.i,1);renderModal();break;
  case 'parseConfirm':{let n=0;for(const e of ui.parseRows){e.id=genId();S.eventos.push(e);n++;}save();ui.selDay=ui.parseFecha;ui.modal=null;ui.parseRows=null;ui.tab='hist';render();toast(n+' eventos importados ✓');break;}
  case 'saveAjustes':{S.ajustes.nombre=document.getElementById('aj-nombre').value.trim();
   const obs=document.getElementById('aj-obs').value.split(',').map(s=>s.trim()).filter(Boolean);if(obs.length)S.ajustes.observadores=obs;
   S.ajustes.obsActivo=document.getElementById('aj-obsActivo').value;save();toast('Ajustes guardados ✓');render();break;}
  case 'printDay':buildPrint(t.dataset.day);setTimeout(()=>window.print(),80);break;
  case 'printFrec':buildPrintFrec();setTimeout(()=>window.print(),80);break;
  case 'clearAll':if(confirm('Esto borra TODOS los eventos y dosis de este dispositivo. ¿Seguro?')&&confirm('Última confirmación: ¿borrar todo?')){S={eventos:[],contexto:{},ajustes:S.ajustes};save();render();toast('Datos borrados');}break;
 }
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.dataset&&t.dataset.field&&ui.sheetId){const e=evById(ui.sheetId);if(!e)return;const k=t.dataset.field;
  if(k==='hora'||k==='horaFin'){if(t.value)e[k]=t.value;else if(k==='horaFin')e[k]='';}
  else e[k]=t.value;
  normalizeEv(e);save();render();}
});
document.getElementById('fileIn').addEventListener('change',function(){
 const file=this.files[0];if(!file)return;
 const rd=new FileReader();
 rd.onload=()=>{try{
   const txt=String(rd.result);let added=0,updated=0;
   if(/\.json$/i.test(file.name)||txt.trim().startsWith('{')){
    const data=JSON.parse(txt);
    if(data.eventos){for(const e of data.eventos){if(!e||!e.fecha||!e.hora)continue;const ex=evById(e.id);if(ex){Object.assign(ex,e);updated++;}else{S.eventos.push(e);added++;}}}
    if(data.contexto){for(const f of Object.keys(data.contexto)){S.contexto[f]=Object.assign({},S.contexto[f],data.contexto[f]);}}
   }else{
    const evs=parseCSV(txt);
    for(const e of evs){const ex=evById(e.id);if(ex){Object.assign(ex,e);updated++;}else{S.eventos.push(e);added++;}}
   }
   save();render();toast('Importado: '+added+' nuevos, '+updated+' actualizados ✓');
  }catch(err){toast('No se pudo leer el archivo');}
  this.value='';};
 rd.readAsText(file,'utf-8');
});
document.getElementById('sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap'){ui.sheetId=null;render();}});
document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap'){ui.modal=null;ui.parseRows=null;renderModal();}});
render();
</script>
