<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Registro de movimientos</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Registro">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --ink: #0f172a;
      --mut: #64748b;
      --pri: #0f766e;
      --pri2: #14b8a6;
      --red: #dc2626;
      --redbg: #fee2e2;
      --amb: #d97706;
      --ambbg: #fef3c7;
      --blue: #2563eb;
      --line: #e2e8f0;
      --gray: #94a3b8
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.45
    }

    #app {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 12px 96px
    }

    header.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 2px 10px
    }

    header.top h1 {
      font-size: 19px;
      margin: 0
    }

    header.top .sub {
      color: var(--mut);
      font-size: 13px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .05)
    }

    .card h2 {
      font-size: 15px;
      margin: 0 0 10px;
      color: var(--pri)
    }

    .card h3 {
      font-size: 14px;
      margin: 12px 0 6px
    }

    .mut {
      color: var(--mut);
      font-size: 13px
    }

    .small {
      font-size: 13px
    }

    .banner {
      background: var(--ambbg);
      border: 1px solid #fcd34d;
      color: #92400e;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 12px
    }

    .banner.red {
      background: var(--redbg);
      border-color: #fca5a5;
      color: #991b1b
    }

    .bignum {
      font-size: 44px;
      font-weight: 800;
      line-height: 1
    }

    .statrow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .stat {
      background: var(--bg);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px
    }

    .stat b {
      font-size: 16px
    }

    .stat.red {
      background: var(--redbg);
      color: #991b1b
    }

    button {
      font: inherit;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: var(--bg);
      color: var(--ink);
      padding: 10px 14px
    }

    button:active {
      transform: scale(.98)
    }

    .btn {
      background: var(--pri);
      color: #fff;
      font-weight: 600
    }

    .btn.sec {
      background: #e2e8f0;
      color: var(--ink)
    }

    .btn.red {
      background: var(--red);
      color: #fff
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink)
    }

    .biglog {
      width: 100%;
      padding: 22px 16px;
      font-size: 21px;
      font-weight: 800;
      border-radius: 18px;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #fff;
      box-shadow: 0 6px 16px rgba(15, 118, 110, .35);
      margin: 4px 0 10px
    }

    .biglog small {
      display: block;
      font-size: 13px;
      font-weight: 500;
      opacity: .9;
      margin-top: 4px
    }

    .seg {
      display: flex;
      background: #e2e8f0;
      border-radius: 12px;
      padding: 4px;
      gap: 4px
    }

    .seg button {
      flex: 1;
      border-radius: 9px;
      padding: 10px 6px;
      font-weight: 600;
      background: transparent;
      color: var(--mut)
    }

    .seg button.on {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 3px rgba(15, 23, 42, .15)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 4px 0 10px
    }

    .chip {
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 14px;
      background: #eef2f7;
      border: 1.5px solid transparent
    }

    .chip.on {
      background: var(--pri);
      color: #fff;
      font-weight: 600
    }

    .chip.on.red {
      background: var(--red)
    }

    .chip.on.amb {
      background: var(--amb)
    }

    .qgrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 8px 0
    }

    .qbtn {
      padding: 12px 4px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      background: #f0fdfa;
      border: 1.5px solid #99f6e4;
      color: #0f766e;
      min-height: 50px;
      line-height: 1.15
    }

    .qbtn:active {
      background: #14b8a6;
      color: #fff;
      border-color: #14b8a6
    }

    .qbtn.gen {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #9f1239;
      font-size: 13px
    }

    .qbtn.on {
      background: #0f766e;
      color: #fff;
      border-color: #0f766e;
      box-shadow: 0 2px 6px rgba(15, 118, 110, .35)
    }

    .qbtn.gen.on {
      background: #e11d48;
      border-color: #e11d48;
      color: #fff
    }

    .qbtn.gen:active {
      background: #e11d48;
      color: #fff
    }

    .qsolo {
      width: 100%;
      padding: 14px 12px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 14px;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #fff;
      box-shadow: 0 4px 12px rgba(15, 118, 110, .3);
      margin: 2px 0 6px
    }

    .qsolo small {
      display: block;
      font-size: 12px;
      font-weight: 500;
      opacity: .92;
      margin-top: 3px
    }

    .qpanel {
      border: 1.5px solid #14b8a6;
      background: #f0fdfa
    }

    .qhead {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 2px
    }

    .qtime {
      font-size: 22px;
      font-weight: 800;
      color: #0f766e;
      line-height: 1
    }

    .qsep {
      border-top: 1px dashed #99f6e4;
      margin: 10px 0 8px
    }

    .lbl {
      font-size: 12px;
      font-weight: 700;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin: 10px 0 2px
    }

    .ev {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 5px solid var(--gray);
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 6px;
      cursor: pointer
    }

    .ev.fuerte {
      border-left-color: var(--red);
      background: #fff5f5
    }

    .ev.leve {
      border-left-color: var(--amb)
    }

    .ev.visible {
      border-left-color: var(--blue)
    }

    .ev .h {
      font-weight: 800;
      font-size: 16px;
      min-width: 52px
    }

    .ev .p {
      font-size: 14px
    }

    .badge {
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 6px;
      padding: 2px 7px;
      background: #e2e8f0;
      color: #334155
    }

    .badge.red {
      background: var(--redbg);
      color: #991b1b
    }

    .badge.amb {
      background: var(--ambbg);
      color: #92400e
    }

    .badge.teal {
      background: #ccfbf1;
      color: #115e59
    }

    .badge.blue {
      background: #dbeafe;
      color: #1e40af
    }

    nav.bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--line);
      display: flex;
      z-index: 40;
      padding-bottom: env(safe-area-inset-bottom)
    }

    nav.bottom .wrap {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      width: 100%
    }

    nav.bottom button {
      flex: 1;
      background: transparent;
      border-radius: 0;
      padding: 9px 2px 7px;
      font-size: 11px;
      color: var(--mut);
      font-weight: 600
    }

    nav.bottom button .ic {
      display: block;
      font-size: 21px;
      line-height: 1.2
    }

    nav.bottom button.on {
      color: var(--pri)
    }

    #sheetWrap {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .45);
      z-index: 50;
      display: none
    }

    #sheetWrap.open {
      display: block
    }

    #sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 18px 18px 0 0;
      max-height: 88vh;
      overflow-y: auto;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom))
    }

    #sheet .grab {
      width: 44px;
      height: 5px;
      background: #cbd5e1;
      border-radius: 3px;
      margin: 0 auto 10px
    }

    #modalWrap {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .5);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px
    }

    #modalWrap.open {
      display: flex
    }

    #modal {
      background: #fff;
      border-radius: 16px;
      max-width: 620px;
      width: 100%;
      max-height: 86vh;
      overflow-y: auto;
      padding: 16px
    }

    textarea,
    input,
    select {
      font: inherit;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 9px 10px;
      width: 100%;
      background: #fff;
      color: var(--ink)
    }

    textarea {
      min-height: 110px;
      resize: vertical
    }

    input[type=time],
    input[type=date] {
      width: auto
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap
    }

    .row>* {
      flex: 1
    }

    .row .fix {
      flex: 0 0 auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px
    }

    th,
    td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top
    }

    th {
      color: var(--mut);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .3px
    }

    #toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      z-index: 80;
      display: none;
      max-width: 90%;
      text-align: center
    }

    .helpbox {
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      margin: 8px 0
    }

    .helpbox.red {
      background: var(--redbg);
      border-color: #fca5a5
    }

    .helpbox ul {
      margin: 6px 0;
      padding-left: 20px
    }

    .helpbox li {
      margin: 4px 0
    }

    .daychips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px
    }

    svg text {
      font-family: system-ui, sans-serif
    }

    #printArea {
      display: none
    }

    @media print {
      body {
        background: #fff
      }

      #app,
      nav.bottom,
      #sheetWrap,
      #modalWrap,
      #toast {
        display: none !important
      }

      #printArea {
        display: block;
        font-size: 12px
      }

      #printArea table {
        font-size: 11px
      }

      #printArea h1 {
        font-size: 18px
      }

      #printArea h2 {
        font-size: 14px;
        margin: 14px 0 6px
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <nav class="bottom">
    <div class="wrap">
      <button data-act="tab" data-tab="hoy" id="nav-hoy"><span class="ic">⚡</span>Hoy</button>
      <button data-act="tab" data-tab="frec" id="nav-frec"><span class="ic">📈</span>Frecuencia</button>
      <button data-act="tab" data-tab="hist" id="nav-hist"><span class="ic">📊</span>Historial</button>
      <button data-act="tab" data-tab="dosis" id="nav-dosis"><span class="ic">💊</span>Dosis</button>
      <button data-act="tab" data-tab="mas" id="nav-mas"><span class="ic">⚙️</span>Más</button>
    </div>
  </nav>
  <div id="sheetWrap">
    <div id="sheet"></div>
  </div>
  <div id="modalWrap">
    <div id="modal"></div>
  </div>
  <div id="toast"></div>
  <div id="printArea"></div>
  <input type="file" id="fileIn" accept=".csv,.json,.txt" style="display:none">

  <script>
    'use strict';
    const SEED = /*SEED-INICIO*/{"eventos":[],"contexto":{}}/*SEED-FIN*/;
    /*LOGIC-START*/
    function pad(n) { return String(n).padStart(2, '0'); }
    function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
    function nowHM() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
    function genId() { return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function fechaLarga(f) { try { return new Date(f + 'T12:00:00').toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return f; } }
    function fechaCorta(f) { const p = f.split('-'); return p[2] + '/' + p[1]; }
    const PARTES = ['Mano', 'Pie', 'Pierna', 'Brazo', 'Hombro', 'Espalda', 'Cara', 'Cabeza', 'Cuello', 'Pecho', 'Ojo', 'Generalizado', 'N.A'];
    const TIPOS = ['Temblor', 'Sacudida', 'Sobresalto', 'Laguna mental', 'Otro'];
    const LADOS = ['Izquierdo', 'Derecho', 'Ambos', 'Un lado (s/e)', 'N.A'];
    const DURS = [['<5s', '<5 s'], ['5-15s', '5–15 s'], ['15-30s', '15–30 s'], ['30-60s', '30–60 s'], ['1-2min', '1–2 min'], ['2-5min', '2–5 min'], ['>5min', '>5 min ⚠️']];
    function durLabel(d) { const x = DURS.find(x => x[0] === d); return x ? x[1] : (d || ''); }
    function ladoAbbr(l) { return l === 'Izquierdo' ? 'izq' : l === 'Derecho' ? 'der' : l === 'Ambos' ? 'ambos' : l === 'N.A' ? 'N.A' : l ? 'un lado' : ''; }

    /* ---- Día-noche: una sesión va de la hora de corte (07:00) a las 06:59 del día
           siguiente. La noche se identifica con la fecha en que empezó. ---- */
    function sumarDias(f, n) { const p = String(f).split('-'); const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); d.setUTCDate(d.getUTCDate() + n); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
    function epochDias(f) { const p = String(f).split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
    function minAbs(fecha, hora) { return epochDias(fecha) * 1440 + (aMin(hora) || 0); }
    // noche a la que pertenece un evento: si la hora es anterior al corte, es la
    // madrugada de la noche que empezó el día anterior.
    function nocheDe(fecha, hora, corte) { const c = aMin(corte || '07:00'); const m = aMin(hora); if (c == null || c === 0 || m == null) return fecha; return m < c ? sumarDias(fecha, -1) : fecha; }
    // inversa: dada la noche (fecha de inicio) y la hora, la fecha de calendario real
    function fechaDeNoche(noche, hora, corte) { const c = aMin(corte || '07:00'); const m = aMin(hora); return (m != null && m < c) ? sumarDias(noche, 1) : noche; }
    function etiquetaNoche(f, corte) { return 'Noche del ' + fechaCorta(f) + ' al ' + fechaCorta(sumarDias(f, 1)); }
    // las 24 horas ordenadas como transcurre la noche: 7,8,…,23,0,1,…,6
    function horasNoche(corte) { const c = Math.floor((aMin(corte || '07:00') || 0) / 60); const out = []; for (let i = 0; i < 24; i++)out.push((c + i) % 24); return out; }
    function newEv(fecha, hora, obs, estado) { return { id: '', fecha: fecha, hora: hora, horaFin: '', dur: '', tipo: '', partes: [], lado: '', intensidad: '', estado: estado || 'Dormida', ojos: false, habla: false, varios: false, revisar: false, nota: '', obs: obs || '', fuente: '' }; }
    function normalizeEv(e) { if (e.intensidad === 'Fuerte' && e.partes.indexOf('Generalizado') >= 0) e.revisar = true; return e; }

    function statsDia(evs) {
      const s = { total: evs.length, fuertes: 0, general: 0, despierta: 0, ojos: 0, habla: 0, sutiles: 0, varios: 0, revisar: 0, porHora: Array(24).fill(0), horaMin: '', horaMax: '' };
      const hs = [];
      for (const e of evs) {
        if (e.intensidad === 'Fuerte') s.fuertes++;
        if (e.partes.indexOf('Generalizado') >= 0) s.general++;
        if (e.estado === 'Despierta') s.despierta++;
        if (e.ojos) s.ojos++;
        if (e.habla) s.habla++;
        if (e.intensidad === 'Sutil') s.sutiles++;
        if (e.varios) s.varios++;
        if (e.revisar) s.revisar++;
        const h = parseInt(e.hora, 10); if (!isNaN(h) && h >= 0 && h < 24) { s.porHora[h]++; hs.push({ k: e.fecha ? minAbs(e.fecha, e.hora) : aMin(e.hora), h: e.hora }); }
      }
      hs.sort((a, b) => a.k - b.k); s.horaMin = hs.length ? hs[0].h : ''; s.horaMax = hs.length ? hs[hs.length - 1].h : '';
      return s;
    }


    // Vocabulario real del chat familiar: plurales, diminutivos y errores de tipeo.
    const MAP_PARTES = [
      [/\bmanos?\b|\bmanit[ao]s?\b|\bmanito\b|\bmamo\b|\bdedos?\b|\bmanitas\b/, 'Mano'],
      [/\bpies?\b|\bpiecitos?\b|\bpiecito\b/, 'Pie'],
      [/\bpiernas?\b|\brodillas?\b/, 'Pierna'],
      [/\bbrazos?\b|\bbrzo\b|\bcodos?\b/, 'Brazo'],
      [/\bhombros?\b/, 'Hombro'],
      [/\bespalda\b/, 'Espalda'],
      [/\bcara\b|\bcarq\b|\bcarita\b/, 'Cara'],
      [/\bcabeza\b|\bcabecita\b|\bnuca\b|parte (de )?atr[áa]s/, 'Cabeza'],
      [/\bcuello\b/, 'Cuello'],
      [/\bpecho\b|\btronco\b/, 'Pecho'],
      [/\bojos?\b/, 'Ojo'],
      [/\bgeneral\b|\bgeneralizado\b|\bgeneraliza\b|\bgeneralizada\b|\bgnral\b|\bfnral\b|\bgral\b|\bgneral\b|\btemblor cuerpo\b|\bcuerpo completo\b|\btodo el cuerpo\b/, 'Generalizado']
    ];
    function applyDesc(ev, desc, isCont) {
      const d = (desc || '').toLowerCase().trim();
      // Solo la hora = sintió un movimiento leve pero no sabe dónde (convención familiar)
      if (!d) { if (!isCont) { ev.intensidad = 'Sutil'; ev.nota = 'Solo hora: movimiento leve, parte no identificada'; } return; }
      const add = p => { if (ev.partes.indexOf(p) < 0) ev.partes.push(p); };
      // partes (pueden ser varias; "generalizado" convive con las partes nombradas)
      const ojosAbiertos = /abr.*ojo|abiert.*ojo|ojo.*abiert|ojito|ojos abiert/.test(d);
      for (const kv of MAP_PARTES) {
        if (!kv[0].test(d)) continue;
        if (kv[1] === 'Ojo') {
          // "abrió los ojos" / "se frota los ojos" NO es la parte Ojo
          if (ojosAbiertos || /frot|frit|picaz|pica/.test(d)) continue;
          if (isCont && /^ojos?\.?$/.test(d)) { ev.ojos = true; continue; }
        }
        add(kv[1]);
      }
      if (/\bmitad\b/.test(d)) { ev.partes = ev.partes.filter(p => p !== 'Generalizado'); ev.lado = 'Un lado (s/e)'; }

    function viewHist() {

    function weekChart(semanas) {
      if (!semanas.length) return '<p class="mut">Aún no hay semanas registradas.</p>';
      const max = Math.max(1, ...semanas.map(s => s.total));
      const W = Math.max(320, semanas.length * 72 + 16), H = 185;
      let out = '';
      semanas.forEach((s, i) => {
        const x = 14 + i * 72; const bh = Math.round(s.total / max * 100); const fh = Math.round(s.fuertes / max * 100);
        out += '<rect x="' + x + '" y="' + (128 - bh) + '" width="44" height="' + Math.max(bh, s.total ? 2 : 0) + '" rx="3" fill="#14b8a6"></rect>';
        if (fh) out += '<rect x="' + x + '" y="' + (128 - bh) + '" width="44" height="' + fh + '" rx="3" fill="#dc2626"></rect>';
        if (s.total) out += '<text x="' + (x + 22) + '" y="' + (122 - bh) + '" font-size="12" text-anchor="middle" font-weight="800" fill="#0f172a">' + s.total + '</text>';
        out += '<text x="' + (x + 22) + '" y="144" font-size="10.5" text-anchor="middle" fill="#334155" font-weight="700">S' + s.iso + '</text>';
        out += '<text x="' + (x + 22) + '" y="158" font-size="9" text-anchor="middle" fill="#64748b">' + fechaCorta(s.lunes) + '</text>';
        out += '<text x="' + (x + 22) + '" y="172" font-size="9" text-anchor="middle" fill="#0f766e">' + s.promDia.toFixed(1) + '/noche</text>';
      });
      return '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch"><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:' + W + 'px;min-width:100%;height:auto;display:block">' + out + '</svg></div><p class="mut small" style="margin:4px 0 0">Rojo = fuertes · S = semana ISO · debajo: lunes de la semana y promedio de eventos/noche · Desliza horizontalmente para ver más semanas.</p>';
    }

      h += '<div class="card" style="border-color:#99f6e4;background:#f0fdfa"><h2>💬 Plantilla de WhatsApp (para la familia)</h2><p class="small mut" style="margin-top:0">Envíenle este texto a quien anota los movimientos. Con que llegue <b>hora + parte del cuerpo</b> ya sirve; el resto es opcional.</p><button class="btn" data-act="waPlantilla">📋 Copiar plantilla para WhatsApp</button><pre class="small" style="white-space:pre-wrap;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin:10px 0 0;max-height:260px;overflow:auto">' + esc(PLANTILLA_WA) + '</pre></div>';
      h += '<div class="card"><h2>📋 Pegar lista (modo WhatsApp)</h2><p class="small mut" style="margin-top:0">Peguen aquí los mensajes y se convierten en eventos. Las líneas sin hora (ej. “Izquierda”, “abre los ojos”) se agregan al evento anterior. <b>Revisen la vista previa antes de confirmar.</b><br><br>💡 <b>Si pegan el chat exportado con fechas</b> (líneas que empiezan con <code>[1/2/26, 8:05:00 PM] …</code>), cada mensaje se coloca <b>en su propia noche automáticamente</b> y la fecha de abajo se ignora. La hora que ella escribe (“8:05”) se interpreta con la hora real del mensaje: 8:05 PM → 20:05, 12:07 AM → 00:07. <b>No hace falta que ella cambie su forma de escribir.</b></p><div class="lbl">Fecha en que empezó la noche</div><input type="date" id="parse-fecha" value="' + (ui.selDay || nocheActual()) + '"><label class="small" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="parse-nocturna" checked style="width:auto"> 🌙 Sesión nocturna (7–11 = de la noche · 12 = medianoche · 1–6 = madrugada del día siguiente)</label><div class="lbl" style="margin-top:8px">Texto</div><textarea id="parse-text" placeholder="20:05 mano y pie&#10;21:17 temblor fuerte generalizado&#10;23:08 fuerte generalizado revisar cámara&#10;00:53 cara, no sé si cuello o cabeza, revisar cámara&#10;1:04"></textarea><div style="margin-top:8px"><button class="btn" data-act="parsePreview">Convertir y revisar</button></div></div>';
      h += '<div class="card"><h2>⚙️ Ajustes</h2><div class="lbl">Nombre de la niña</div><input id="aj-nombre" value="' + esc(a.nombre) + '" placeholder="Nombre"><div class="lbl" style="margin-top:8px">Observadores (separados por coma)</div><input id="aj-obs" value="' + esc(a.observadores.join(', ')) + '"><div class="lbl" style="margin-top:8px">Quién registra en este dispositivo</div><select id="aj-obsActivo">' + a.observadores.map(o => '<option' + (o === a.obsActivo ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select><div class="lbl" style="margin-top:8px">🌙 Hora de corte del día-noche</div><input type="time" id="aj-corte" value="' + esc(a.horaCorte || '07:00') + '"><p class="mut small" style="margin:2px 0 0">Todo lo que ocurra antes de esta hora se suma a la noche anterior. Con <b>07:00</b>: de 7:00 AM a 6:59 AM del día siguiente es un mismo día/noche.</p><div style="margin-top:10px"><button class="btn" data-act="saveAjustes">Guardar ajustes</button></div></div>';
      h += '<div class="card"><h2>❓ Guía rápida</h2>' + helpHtml() + '</div>';
      h += '<div class="card"><h2>🗑️ Datos</h2><p class="small mut">Guardado: ' + S.eventos.length + ' eventos en este dispositivo' + (storageOK ? '' : ' (⚠️ solo en memoria: vista previa)') + '.</p><button class="btn red" data-act="clearAll">Borrar todos los datos</button></div>';
      return h;
    }

    function helpHtml() {
      return '<div class="helpbox"><b>🌙 Una noche es un solo día</b><ul><li>El día-noche va de <b>' + corte() + ' a las 06:59 del día siguiente</b>. Lo que pasa a la 1:04 AM del 20/11 pertenece a la <b>noche del 19/11</b>.</li><li>La noche se nombra con la fecha en que empezó. En las listas, <b>+1d</b> marca los eventos de después de medianoche.</li><li>La hora de corte se cambia en Ajustes (por defecto 07:00).</li></ul></div>'
        + '<div class="helpbox"><b>Qué registrar</b><ul><li><b>Cada movimiento</b>, aunque sea leve: marquen <b>todas las partes que se movieron</b> (pueden ser varias), el lado y la intensidad, y toquen <b>REGISTRAR</b>. Sin nada marcado queda como “solo la hora” (leve, sin parte).</li><li><b>Completar cuando se pueda:</b> el panel “último registro” queda abajo con lado, intensidad, ojos y habla. También se puede completar después tocando el evento en la lista.</li><li><b>Parte del cuerpo y lado:</b> es lo que el neurólogo pidió junto con la frecuencia. Si no se sabe, anoten “revisar cámara”.</li><li><b>Solo la hora</b> = movimiento leve cuya ubicación no se identificó (queda como “Sutil”, sin parte).</li><li><b>Duración:</b> para eventos de segundos usen rangos (&lt;5 s, 5–15 s…) o déjenlo vacío. Importan más la <b>frecuencia, los racimos y las partes del cuerpo</b>.</li><li><b>Varios seguidos:</b> si en un minuto hay varios movimientos, marquen “Varios seguidos”.</li><li><b>Despierta:</b> anoten lo que la niña diga (“me tembló la pierna”) en la nota.</li></ul></div>'
        + '<div class="helpbox"><b>🎥 Videos (muy útiles para el neurólogo)</b><ul><li>Luz encendida, que se vean <b>cara y cuerpo completo</b>; narrar en voz alta lo que se ve.</li><li>Grabar hasta que termine y cómo queda después (si responde, habla, se vuelve a dormir).</li><li>Anotar la hora del video y <b>sincronizar el reloj de la cámara con el celular</b> (suelen diferir).</li><li>Los eventos marcados 🎥 son los que conviene revisar/guardar (incluye “ver en cuello y cabeza”).</li></ul></div>'
        + '<div class="helpbox red"><b>⚠️ Cuándo buscar ayuda urgente</b><ul><li>Un evento que dura <b>más de 5 minutos</b>.</li><li>Varios eventos seguidos <b>sin recuperarse entre ellos</b>.</li><li>Dificultad para respirar, labios o cara morados.</li><li>No responde o no despierta como siempre después del evento.</li><li>Se lastima durante un evento.</li></ul><b>→ Llamen a emergencias / acudan a urgencias.</b> Y avisen al neurólogo <b>pronto</b> (sin esperar la próxima cita) por el cambio de patrón: más frecuentes, nuevas partes del cuerpo y episodios despierta. <b>No suspendan ni bajen el Keppra por su cuenta.</b></div>'
        + '<div class="helpbox"><b>👨‍👩‍👧 En familia</b><ul><li>Quien mira la cámara registra; los demás mandan sus observaciones por WhatsApp con la <b>plantilla</b> de arriba.</li><li>Al terminar la noche (o al día siguiente): peguen los mensajes en “Pegar lista” con 🌙 sesión nocturna activada.</li><li>Para la cita: “Informe médico” (imprimir/PDF) + el CSV + los videos de los eventos 🎥.</li></ul></div>';
    }
    /* ---------- sheet (editor de evento) ---------- */
    function renderSheet() {
      const w = document.getElementById('sheetWrap'); const sh = document.getElementById('sheet');
      const e = ui.sheetId ? evById(ui.sheetId) : null;
      if (!e) { w.className = ''; sh.innerHTML = ''; return; }
      w.className = 'open';
      let h = '<div class="grab"></div><div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:17px">Evento ' + e.hora + (e.horaFin ? '–' + e.horaFin : '') + '</h2><button class="btn ghost fix" data-act="closeSheet">Listo ✓</button></div>';
      h += '<div class="row" style="margin-top:8px"><div><div class="lbl">Fecha</div><input type="date" data-field="fecha" value="' + e.fecha + '"></div><div><div class="lbl">Hora inicio</div><input type="time" data-field="hora" value="' + e.hora + '"></div><div><div class="lbl">Hora fin (opc.)</div><input type="time" data-field="horaFin" value="' + e.horaFin + '"></div></div>';
      h += '<div class="lbl">Parte del cuerpo</div><div class="chips">' + PARTES.map(p => '<button class="chip ' + (e.partes.indexOf(p) >= 0 ? 'on' : '') + '" data-act="chipPart" data-val="' + p + '">' + p + '</button>').join('') + '</div>';
      h += '<div class="lbl">Lado</div><div class="chips">' + LADOS.map(l => '<button class="chip ' + (e.lado === l ? 'on' : '') + '" data-act="chipLado" data-val="' + l + '">' + l + '</button>').join('') + '</div>';
      h += '<div class="lbl">Intensidad</div><div class="chips">' + [['Sutil', 'Sutil (apenas se ve)', ''], ['Leve', 'Leve', 'amb'], ['Fuerte', 'Fuerte', 'red']].map(x => '<button class="chip ' + x[2] + ' ' + (e.intensidad === x[0] ? 'on' : '') + '" data-act="chipInt" data-val="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';
      h += '<div class="lbl">Tipo</div><div class="chips">' + TIPOS.map(t => '<button class="chip ' + (e.tipo === t ? 'on' : '') + '" data-act="chipTipo" data-val="' + t + '">' + t + '</button>').join('') + '</div>';
      h += '<div class="lbl">Duración aproximada (opcional)</div><div class="chips">' + DURS.map(d => '<button class="chip ' + (d[0] === '>5min' ? 'red' : '') + ' ' + (e.dur === d[0] ? 'on' : '') + '" data-act="chipDur" data-val="' + d[0] + '">' + d[1] + '</button>').join('') + '</div>';
      if (e.dur === '>5min') h += '<div class="banner red">⚠️ Un evento de más de 5 minutos es una <b>urgencia médica</b>: llamen a emergencias. Si ya pasó, avisen al neurólogo hoy mismo.</div>';
      h += '<div class="lbl">Estado</div><div class="seg">' + ['Dormida', 'Despierta', 'No sé'].map(s => '<button data-act="chipEstado" data-val="' + s + '" class="' + (e.estado === s ? 'on' : '') + '">' + (s === 'Dormida' ? '😴 ' : s === 'Despierta' ? '👀 ' : '') + s + '</button>').join('') + '</div>';
      h += '<div class="lbl">Observaciones rápidas</div><div class="chips">' + [['ojos', '👀 Abrió los ojos'], ['habla', '🗣 Habló'], ['varios', '⧉ Varios seguidos'], ['revisar', '🎥 Revisar/guardar video']].map(t => '<button class="chip ' + (t[0] === 'revisar' ? 'amb' : '') + ' ' + (e[t[0]] ? 'on' : '') + '" data-act="tog" data-key="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>';
      h += '<div class="lbl">Nota (qué se vio, qué dijo la niña…)</div><input data-field="nota" value="' + esc(e.nota) + '" placeholder="ej. como tocando piano; me dijo “me tembló la pierna”">';
      h += '<div class="lbl">Registró</div><select data-field="obs">' + S.ajustes.observadores.map(o => '<option' + (o === e.obs ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + (S.ajustes.observadores.indexOf(e.obs) < 0 && e.obs ? '<option selected>' + esc(e.obs) + '</option>' : '') + '</select>';
      if (e.fuente) h += '<p class="mut small">Fuente: ' + esc(e.fuente) + '</p>';
      h += '<div class="row" style="margin-top:12px"><button class="btn" data-act="closeSheet">Guardar y cerrar ✓</button><button class="btn red fix" data-act="delEv" data-id="' + e.id + '">Borrar</button></div>';
      sh.innerHTML = h;
    }
    function renderModal() {
      const w = document.getElementById('modalWrap'); const m = document.getElementById('modal');
      if (!ui.modal) { w.className = ''; m.innerHTML = ''; return; }
      w.className = 'open';
      let h = '';
      if (ui.modal === 'wa') {
        const txt = ui.waText || '';
        h = '<div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:16px">Resumen para WhatsApp</h2><button class="btn ghost fix" data-act="closeModal">✕</button></div><p class="mut small">Copien y envíen al grupo familiar / al médico.</p><textarea id="waText" readonly style="min-height:260px;font-size:13px">' + esc(txt) + '</textarea><div style="margin-top:8px"><button class="btn" data-act="copyModal">Copiar texto</button></div>';
      } else if (ui.modal === 'parse') {
        const rows = ui.parseRows || [];
        const noches = [...new Set(rows.map(e => nocheDe(e.fecha, e.hora, corte())))].sort();
        const clave = e => e.fecha + '|' + e.hora + '|' + e.partes.join('+') + '|' + String(e.nota || '').toLowerCase().replace(/[^a-záéíóúñ0-9]/g, '');
        const yaExact = new Set(S.eventos.map(clave)), yaHora = new Set(S.eventos.map(e => e.fecha + '|' + e.hora));
        const nExact = rows.filter(e => yaExact.has(clave(e))).length;
        const nCoin = rows.filter(e => !yaExact.has(clave(e)) && yaHora.has(e.fecha + '|' + e.hora)).length;
        const cab = noches.length > 1
          ? 'Este pegado trae <b>' + noches.length + ' noches distintas</b> (' + fechaCorta(noches[0]) + ' → ' + fechaCorta(noches[noches.length - 1]) + '): cada mensaje se guarda en su propia noche.'
          : 'Fecha: <b>' + fechaLarga(ui.parseFecha) + '</b>.';
        h = '<div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:16px">Revisar conversión (' + rows.length + ' eventos)</h2><button class="btn ghost fix" data-act="closeModal">✕</button></div><p class="mut small">' + cab + ' Verifiquen las horas y borren filas que no sean eventos. Los eventos de madrugada se guardan con la fecha del día siguiente, pero cuentan en esta misma noche. Podrán editar cada evento después.</p>';
        if (nExact) h += '<p class="small" style="background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:8px;margin:0 0 8px">ℹ️ <b>' + nExact + '</b> ' + (nExact === 1 ? 'evento idéntico ya estaba' : 'eventos idénticos ya estaban') + ' registrado (misma fecha, hora, parte y nota): no se duplicarán.</p>';
        if (nCoin) h += '<label class="small" style="display:flex;gap:8px;align-items:flex-start;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:8px;margin:0 0 8px"><input type="checkbox" id="parse-omitir"' + (ui.parseOmitir ? ' checked' : '') + ' style="width:auto;margin-top:2px"><span>⚠️ <b>' + nCoin + '</b> ' + (nCoin === 1 ? 'evento coincide' : 'eventos coinciden') + ' en fecha y hora con algo ya registrado, pero con distinto detalle. Marquen esto para <b>omitirlos</b> (si es el mismo registro pegado otra vez). Déjenlo sin marcar si son movimientos distintos en el mismo minuto.</span></label>';
        h += '<div style="max-height:46vh;overflow-y:auto">' + rows.map((e, i) => '<div class="ev" style="cursor:default"><span class="h">' + e.hora + (e.horaFin ? '–' + e.horaFin : '') + (e.fecha !== ui.parseFecha ? '<span class="mut" style="font-weight:400;font-size:9px"> ' + fechaCorta(e.fecha) + '</span>' : '') + (yaExact.has(clave(e)) ? '<span class="mut" style="font-weight:400;font-size:9px"> · ya estaba</span>' : '') + '</span><span class="p">' + esc(e.partes.join(' + ') || 'movimiento') + '</span>' + badges(e) + '<button class="btn ghost fix" style="padding:4px 10px;margin-left:auto" data-act="parseDel" data-i="' + i + '">✕</button></div>').join('') + '</div>';
        h += '<div class="row" style="margin-top:10px"><button class="btn" data-act="parseConfirm">Confirmar e importar ' + rows.length + '</button><button class="btn ghost fix" data-act="closeModal">Cancelar</button></div>';
      }
      m.innerHTML = h;
    }

    /* ---------- informe imprimible ---------- */
    function buildPrint(f) {
      const evs = evsDia(f); const st = statsDia(evs); const ctx = getCtx(f); const a = S.ajustes;
      let h = '<h1>Registro de movimientos — ' + (a.nombre ? esc(a.nombre) + ' — ' : '') + etiquetaNoche(f, corte()) + '</h1>';
      h += '<p style="font-size:11px;color:#555;margin:2px 0 6px">Sesión nocturna: ' + fechaLarga(f) + ' a ' + fechaLarga(sumarDias(f, 1)) + ' · un día-noche va de ' + corte() + ' a las 06:59 del día siguiente. Las horas después de medianoche pertenecen a esta misma noche.</p>';
      h += '<p><b>Total:</b> ' + st.total + ' eventos (' + (st.horaMin || '—') + '–' + (st.horaMax || '—') + ') · <b>Fuertes:</b> ' + st.fuertes + ' · <b>Generalizados:</b> ' + st.general + ' · <b>Con apertura de ojos:</b> ' + st.ojos + ' · <b>Despierta:</b> ' + st.despierta + ' · <b>Sutiles:</b> ' + st.sutiles + '</p>';
      const fd = frecDia(evs, ctx, corte());
      if (fd.tasa != null) h += '<p><b>Frecuencia:</b> ' + fmtTasa(fd.tasa) + ' eventos/hora · ventana ' + fd.ventana + (fd.obsReal ? ' (observada)' : ' (primer→último evento)') + (fd.intervalo != null ? ' · intervalo medio entre eventos: ' + fd.intervalo.toFixed(1) + ' min' : '') + '</p>';
      if (ctx.ml || a.mgml) h += '<p><b>Keppra:</b> ' + (ctx.ml ? ctx.ml + ' mL por toma × ' + (ctx.tomas || '?') + ' tomas/día' : 'dosis no registrada ese día') + (a.mgml ? ' · concentración ' + a.mgml + ' mg/mL' : '') + (a.peso ? ' · peso ' + a.peso + ' kg' : '') + '</p>';
      if (ctx.sueno || ctx.animo || ctx.notas) h += '<p><b>Contexto:</b> ' + (ctx.sueno ? 'sueño ~' + ctx.sueno + ' h · ' : '') + (ctx.animo ? 'ánimo/irritabilidad ' + ctx.animo + '/5 · ' : '') + (ctx.notas ? esc(ctx.notas) : '') + '</p>';
      h += '<h2>Frecuencia por hora (orden de la noche)</h2><table><tr>' + horasNoche(corte()).filter(i => st.porHora[i]).map(i => '<th>' + i + 'h</th>').join('') + '</tr><tr>' + horasNoche(corte()).filter(i => st.porHora[i]).map(i => '<td><b>' + st.porHora[i] + '</b></td>').join('') + '</tr></table>';
      h += '<h2>Eventos</h2><table><tr><th>Hora</th><th>Partes</th><th>Lado</th><th>Intensidad</th><th>Tipo</th><th>Estado</th><th>Duración</th><th>Ojos</th><th>Habla</th><th>Varios</th><th>Video</th><th>Nota</th></tr>';
      for (const e of evs) { h += '<tr><td><b>' + e.hora + (e.horaFin ? '–' + e.horaFin : '') + '</b>' + (e.fecha !== f ? '<br><span style="font-size:9px;color:#555">' + fechaCorta(e.fecha) + '</span>' : '') + '</td><td>' + esc(e.partes.join(', ')) + '</td><td>' + esc(ladoAbbr(e.lado)) + '</td><td>' + esc(e.intensidad) + '</td><td>' + esc(e.tipo) + '</td><td>' + esc(e.estado) + '</td><td>' + esc(durLabel(e.dur)) + '</td><td>' + (e.ojos ? 'sí' : '') + '</td><td>' + (e.habla ? 'sí' : '') + '</td><td>' + (e.varios ? 'sí' : '') + '</td><td>' + (e.revisar ? '🎥' : '') + '</td><td>' + esc(e.nota) + '</td></tr>'; }
      h += '</table><p style="font-size:10px;color:#555">Registro familiar. En eventos de segundos la duración exacta no siempre es registrable; se priorizó hora y frecuencia. “Sutil” = movimiento leve apenas perceptible; cuando solo se anotó la hora, la parte del cuerpo no fue identificada. Revisar 🎥 = video pendiente de revisar/guardar.</p>';
      document.getElementById('printArea').innerHTML = h;
    }

    function buildPrintFrec() {
      const g = frecGlobal(S.eventos, S.contexto, corte()); const sem = frecSemanas(S.eventos, S.contexto, corte()); const a = S.ajustes;
      let h = '<h1>Informe de frecuencia — ' + (a.nombre ? esc(a.nombre) + ' — ' : '') + 'registro de movimientos</h1>';
      h += '<p><b>Noches registradas:</b> ' + g.dias + ' · <b>Total:</b> ' + g.total + ' eventos · <b>Promedio:</b> ' + g.promDia.toFixed(1) + ' eventos/noche' + (g.tasaGlobal != null ? ' · <b>' + fmtTasa(g.tasaGlobal) + ' eventos/hora</b>' : '') + '</p>';
      h += '<p><b>Fuertes:</b> ' + g.fuertes + ' · <b>Generalizados:</b> ' + g.general + ' · <b>Despierta:</b> ' + g.despierta + (a.mgml ? ' · concentración ' + a.mgml + ' mg/mL' : '') + (a.peso ? ' · peso ' + a.peso + ' kg' : '') + '</p>';
      if (g.tendencia) { const t = g.tendencia; h += '<p><b>Tendencia:</b> ' + (t.cambioPct >= 0 ? 'aumento' : 'descenso') + ' de ' + Math.abs(t.cambioPct).toFixed(0) + '% en eventos/hora entre ' + fechaCorta(t.de) + ' (' + fmtTasa(t.tasaA) + '/h) y ' + fechaCorta(t.a) + ' (' + fmtTasa(t.tasaB) + '/h).</p>'; }
      h += '<h2>Frecuencia por noche</h2><table><tr><th>Noche (fecha de inicio)</th><th>Eventos</th><th>Fuertes</th><th>Generalizados</th><th>Despierta</th><th>Ventana</th><th>Eventos/hora</th><th>Intervalo medio (min)</th><th>Keppra mL/toma</th></tr>';
      for (const d of g.porDia) { h += '<tr><td>' + d.fecha + ' → ' + sumarDias(d.fecha, 1) + '</td><td><b>' + d.total + '</b></td><td>' + d.fuertes + '</td><td>' + d.general + '</td><td>' + d.despierta + '</td><td>' + (d.ventana || '—') + (d.obsReal ? '' : ' *') + '</td><td><b>' + fmtTasa(d.tasa) + '</b></td><td>' + (d.intervalo != null ? d.intervalo.toFixed(1) : '—') + '</td><td>' + esc(d.ml || '') + '</td></tr>'; }
      h += '</table>';
      if (sem.length) {
        h += '<h2>Frecuencia por semana (lunes a domingo)</h2><table><tr><th>Semana</th><th>Rango</th><th>Noches con registro</th><th>Eventos</th><th>Eventos/noche</th><th>Eventos/hora</th><th>Fuertes</th><th>Generalizados</th><th>Despierta</th><th>Δ% vs ant.</th></tr>';
        for (const s of sem) { h += '<tr><td>S' + s.iso + '</td><td>' + s.etiqueta + '</td><td>' + s.diasRegistrados + '/7</td><td><b>' + s.total + '</b></td><td>' + s.promDia.toFixed(1) + '</td><td><b>' + fmtTasa(s.tasa) + '</b></td><td>' + s.fuertes + '</td><td>' + s.general + '</td><td>' + s.despierta + '</td><td>' + (s.cambioPct != null ? (s.cambioPct >= 0 ? '+' : '') + s.cambioPct.toFixed(0) + '%' : '—') + '</td></tr>'; }
        h += '</table><p style="font-size:10px;color:#555">Semanas ISO de lunes a domingo. El promedio de eventos/noche usa solo las noches con registro. Δ% compara eventos/hora con la semana anterior.</p>';
      }
      h += '<h2>Horas pico (suma de todas las noches, en orden de la noche)</h2><table><tr>' + horasNoche(corte()).filter(i => g.porHora[i]).map(i => '<th>' + i + 'h</th>').join('') + '</tr><tr>' + horasNoche(corte()).filter(i => g.porHora[i]).map(i => '<td><b>' + g.porHora[i] + '</b></td>').join('') + '</tr></table>';
      const rank = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
      h += '<h2>Frecuencia por parte del cuerpo</h2><table><tr>' + rank(g.porParte).map(kv => '<th>' + esc(kv[0]) + '</th>').join('') + '</tr><tr>' + rank(g.porParte).map(kv => '<td><b>' + kv[1] + '</b></td>').join('') + '</tr></table>';
      h += '<p style="font-size:10px;color:#555">* Ventana estimada como primer→último evento de la noche (no se indicó horario observado). Un día-noche va de ' + corte() + ' a las 06:59 del día siguiente; la madrugada cuenta en la misma noche. Tasa eventos/hora = eventos ÷ horas de la ventana. Registro familiar; en eventos de segundos se priorizó hora y frecuencia sobre duración exacta.</p>';
      document.getElementById('printArea').innerHTML = h;
    }

    /* ---------- acciones ---------- */
    function addEvent(e) { normalizeEv(e); if (!e.id) e.id = genId(); S.eventos.push(e); save(); return e; }
    function download(name, content, mime) {
      try { const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500); toast('Descargando ' + name); }
      catch (err) { toast('No se pudo descargar aquí. Abre la app fuera de la vista previa.'); }
    }
    document.addEventListener('click', ev => {
      const t = ev.target.closest('[data-act]'); if (!t) return;
      const act = t.dataset.act;
      const cur = ui.sheetId ? evById(ui.sheetId) : null;
      switch (act) {
        case 'tab': ui.tab = t.dataset.tab; render(); window.scrollTo(0, 0); break;
        case 'instalar': instalarApp(); break;
        case 'introOk': S.ajustes.introVista = true; save(); render(); break;
        case 'defEstado': S.ajustes.estadoDefault = t.dataset.val; save(); render(); break;
        case 'quickLog': {
          const a = ui.arm; const e = newEv(todayStr(), nowHM(), S.ajustes.obsActivo, S.ajustes.estadoDefault);
          e.partes = a.partes.slice(); e.lado = a.lado; e.intensidad = a.intensidad;
          if (!e.partes.length && !e.intensidad) { e.intensidad = 'Sutil'; e.nota = 'Solo hora: movimiento leve, parte no identificada'; }
          e.fuente = 'App'; addEvent(e); ui.quickId = e.id; ui.arm = { partes: [], lado: '', intensidad: '' }; save(); render();
          toast(e.hora + (e.partes.length ? ' · ' + e.partes.join(' + ') : ' · solo hora') + ' ✓'); break;
        }
        case 'armPart': { const p = t.dataset.val; const i = ui.arm.partes.indexOf(p); if (i >= 0) ui.arm.partes.splice(i, 1); else ui.arm.partes.push(p); render(); break; }
        case 'armLado': ui.arm.lado = ui.arm.lado === t.dataset.val ? '' : t.dataset.val; render(); break;
        case 'armInt': ui.arm.intensidad = ui.arm.intensidad === t.dataset.val ? '' : t.dataset.val; render(); break;
        case 'armClear': ui.arm = { partes: [], lado: '', intensidad: '' }; render(); break;
        case 'qPart': { const e = evById(t.dataset.id || ui.quickId) || lastQuick(); if (!e) break; const p = t.dataset.val; const i = e.partes.indexOf(p); if (i >= 0) e.partes.splice(i, 1); else e.partes.push(p); normalizeEv(e); save(); render(); break; }
        case 'qRepeat': {
          const o = evById(t.dataset.id || ui.quickId) || lastQuick(); if (!o) break;
          const e = newEv(todayStr(), nowHM(), S.ajustes.obsActivo, o.estado);
          e.partes = o.partes.slice(); e.lado = o.lado; e.intensidad = o.intensidad; e.tipo = o.tipo; e.ojos = o.ojos; e.habla = o.habla; e.fuente = 'App (otro igual)';
          addEvent(e); ui.quickId = e.id; save(); render(); toast(e.hora + ' · otro igual ✓'); break;
        }
        case 'quickPart': {
          const p = t.dataset.val; const e = newEv(todayStr(), nowHM(), S.ajustes.obsActivo, S.ajustes.estadoDefault);
          e.partes = [p]; e.fuente = 'App (toque rápido)';
          addEvent(e); ui.quickId = e.id; save(); render(); toast(e.hora + ' · ' + p + ' ✓'); break;
        }
        case 'quickSolo': {
          const e = newEv(todayStr(), nowHM(), S.ajustes.obsActivo, S.ajustes.estadoDefault);
          e.intensidad = 'Sutil'; e.nota = 'Solo hora: movimiento leve, parte no identificada'; e.fuente = 'App (toque rápido)';
          addEvent(e); ui.quickId = e.id; save(); render(); toast(e.hora + ' · solo hora ✓'); break;
        }
        case 'qLado': { const e = evById(t.dataset.id || ui.quickId) || lastQuick(); if (!e) break; e.lado = e.lado === t.dataset.val ? '' : t.dataset.val; save(); render(); break; }
        case 'qInt': { const e = evById(t.dataset.id || ui.quickId) || lastQuick(); if (!e) break; e.intensidad = e.intensidad === t.dataset.val ? '' : t.dataset.val; normalizeEv(e); save(); render(); break; }
        case 'qTog': { const e = evById(t.dataset.id || ui.quickId) || lastQuick(); if (!e) break; const k = t.dataset.key; e[k] = !e[k]; save(); render(); break; }
        case 'qEdit': { const id = t.dataset.id || ui.quickId; if (id) { ui.sheetId = id; renderSheet(); } break; }
        case 'qUndo': {
          const id = t.dataset.id || ui.quickId; if (!id) break; const e = evById(id); if (!e) break;
          const mins = (Date.now() - new Date(e.fecha + 'T' + e.hora + ':00').getTime()) / 60000;
          if (mins > 2 && !confirm('Este evento es de ' + e.hora + ', no es de ahora. ¿Borrarlo igual?')) break;
          S.eventos = S.eventos.filter(x => x.id !== id); if (ui.quickId === id) ui.quickId = null; save(); render(); toast('Deshecho (' + e.hora + ')'); break;
        }
        case 'pastEvent': { const e = newEv(todayStr(), nowHM(), S.ajustes.obsActivo, S.ajustes.estadoDefault); e.fuente = 'App (hora manual)'; addEvent(e); ui.sheetId = e.id; render(); toast('Ajusten la hora del evento'); break; }
        case 'openEv': ui.sheetId = t.dataset.id; renderSheet(); break;
        case 'closeSheet': ui.sheetId = null; render(); break;
        case 'chipPart': {
          if (!cur) break; const p = t.dataset.val; const i = cur.partes.indexOf(p);
          if (i >= 0) cur.partes.splice(i, 1); else cur.partes.push(p);
          normalizeEv(cur); save(); renderSheet(); break;
        }
        case 'chipLado': if (cur) { cur.lado = cur.lado === t.dataset.val ? '' : t.dataset.val; save(); renderSheet(); } break;
        case 'chipInt': if (cur) { cur.intensidad = cur.intensidad === t.dataset.val ? '' : t.dataset.val; normalizeEv(cur); save(); renderSheet(); } break;
        case 'chipTipo': if (cur) { cur.tipo = cur.tipo === t.dataset.val ? '' : t.dataset.val; save(); renderSheet(); } break;
        case 'chipDur': if (cur) { cur.dur = cur.dur === t.dataset.val ? '' : t.dataset.val; save(); renderSheet(); } break;
        case 'chipEstado': if (cur) { cur.estado = t.dataset.val; save(); renderSheet(); } break;
        case 'tog': if (cur) { const k = t.dataset.key; cur[k] = !cur[k]; save(); renderSheet(); } break;
        case 'delEv': { const id = t.dataset.id; if (confirm('¿Borrar este evento?')) { S.eventos = S.eventos.filter(e => e.id !== id); save(); ui.sheetId = null; render(); toast('Evento borrado'); } break; }
        case 'selDay': ui.selDay = t.dataset.day; ui.tab = 'hist'; render(); break;
        case 'goHist': ui.selDay = t.dataset.day; ui.tab = 'hist'; render(); window.scrollTo(0, 0); break;
        case 'ctxSave': { const f = t.dataset.day; setCtx(f, { sueno: document.getElementById('ctx-sueno').value, animo: document.getElementById('ctx-animo').value, notas: document.getElementById('ctx-notas').value, obsDesde: document.getElementById('ctx-desde').value, obsHasta: document.getElementById('ctx-hasta').value }); toast('Contexto guardado ✓'); render(); break; }
        case 'saveMgPeso': S.ajustes.mgml = document.getElementById('aj-mgml').value; S.ajustes.peso = document.getElementById('aj-peso').value; save(); toast('Guardado ✓'); render(); break;
        case 'addDose': { const f = document.getElementById('dose-fecha').value; const ml = document.getElementById('dose-ml').value; const tomas = document.getElementById('dose-tomas').value; if (!f || !ml) { toast('Completa fecha y mL'); break; } setCtx(f, { ml: ml, tomas: tomas }); toast('Dosis guardada ✓'); render(); break; }
        case 'exportCSV': download('eventos_' + todayStr() + '.csv', toCSV(S.eventos.slice().sort((a, b) => (a.fecha + a.hora) < (b.fecha + b.hora) ? -1 : 1)), 'text/csv;charset=utf-8'); break;
        case 'exportDias': { const rows = ['fecha;ml_por_toma;tomas_dia;sueno_h;animo_1a5;notas']; Object.keys(S.contexto).sort().forEach(f => { const c = S.contexto[f]; rows.push([f, c.ml || '', c.tomas || '', c.sueno || '', c.animo || '', csvEsc(c.notas || '')].join(';')); }); download('dias_dosis_' + todayStr() + '.csv', '﻿' + rows.join('\n'), 'text/csv;charset=utf-8'); break; }
        case 'exportJSON': download('respaldo_registro_' + todayStr() + '.json', JSON.stringify(S, null, 1), 'application/json'); break;
        case 'importFile': document.getElementById('fileIn').click(); break;
        case 'waSummary': { const f = t.dataset.day || nocheActual(); ui.waText = resumenDia(f, evsDia(f), getCtx(f), S.ajustes.nombre, corte()); ui.modal = 'wa'; renderModal(); break; }
        case 'waPlantilla': ui.waText = PLANTILLA_WA; ui.modal = 'wa'; renderModal(); break;
        case 'waFrec': ui.waText = resumenFrecuencia(frecGlobal(S.eventos, S.contexto, corte()), S.ajustes.nombre, frecSemanas(S.eventos, S.contexto, corte()), corte()); ui.modal = 'wa'; renderModal(); break;
        case 'copyModal': {
          const ta = document.getElementById('waText'); ta.select(); ta.setSelectionRange(0, 999999); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { }
          if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(() => toast('Copiado ✓')).catch(() => toast(ok ? 'Copiado ✓' : 'Seleccionado: mantén presionado y copia')); }
          else toast(ok ? 'Copiado ✓' : 'Seleccionado: mantén presionado y copia'); break;
        }
        case 'closeModal': ui.modal = null; ui.parseRows = null; renderModal(); break;
        case 'parsePreview': {
          const txt = document.getElementById('parse-text').value; const f = document.getElementById('parse-fecha').value || todayStr(); if (!txt.trim()) { toast('Pega el texto primero'); break; }
          const noct = !!(document.getElementById('parse-nocturna') && document.getElementById('parse-nocturna').checked);
          ui.parseRows = parseLista(txt, f, S.ajustes.obsActivo, S.ajustes.estadoDefault, noct, corte()).map(normalizeEv); ui.parseFecha = f;
          if (!ui.parseRows.length) { toast('No se encontraron horas (ej. 21:17)'); break; }
          ui.modal = 'parse'; renderModal(); break;
        }
        case 'parseDel': { const c = document.getElementById('parse-omitir'); if (c) ui.parseOmitir = c.checked; ui.parseRows.splice(+t.dataset.i, 1); renderModal(); break; }
        case 'parseConfirm': {
          const om = !!(document.getElementById('parse-omitir') && document.getElementById('parse-omitir').checked);
          const clave = e => e.fecha + '|' + e.hora + '|' + e.partes.join('+') + '|' + String(e.nota || '').toLowerCase().replace(/[^a-záéíóúñ0-9]/g, '');
          const yaExact = new Set(S.eventos.map(clave)), yaHora = new Set(S.eventos.map(e => e.fecha + '|' + e.hora));
          let n = 0, dup = 0, omit = 0, primera = null;
          for (const e of ui.parseRows) {
            if (yaExact.has(clave(e))) { dup++; continue; }
            if (om && yaHora.has(e.fecha + '|' + e.hora)) { omit++; continue; }
            yaExact.add(clave(e)); yaHora.add(e.fecha + '|' + e.hora);
            e.id = genId(); S.eventos.push(e); n++; if (!primera) primera = e;
          }
          save(); ui.selDay = primera ? nocheDe(primera.fecha, primera.hora, corte()) : ui.parseFecha;
          ui.modal = null; ui.parseRows = null; ui.parseOmitir = false; ui.tab = 'hist'; render();
          toast(n + ' eventos importados ✓' + (dup ? ' · ' + dup + ' ya estaban' : '') + (omit ? ' · ' + omit + ' omitidos' : '')); break;
        }
        case 'saveAjustes': {
          S.ajustes.nombre = document.getElementById('aj-nombre').value.trim();
          const obs = document.getElementById('aj-obs').value.split(',').map(s => s.trim()).filter(Boolean); if (obs.length) S.ajustes.observadores = obs;
          S.ajustes.obsActivo = document.getElementById('aj-obsActivo').value;
          const ct = document.getElementById('aj-corte'); if (ct && ct.value) S.ajustes.horaCorte = ct.value;
          ui.selDay = ui.selDay || nocheActual(); save(); toast('Ajustes guardados ✓'); render(); break;
        }
        case 'printDay': buildPrint(t.dataset.day); setTimeout(() => window.print(), 80); break;
        case 'printFrec': buildPrintFrec(); setTimeout(() => window.print(), 80); break;
        case 'clearAll': if (confirm('Esto borra TODOS los eventos y dosis de este dispositivo. ¿Seguro?') && confirm('Última confirmación: ¿borrar todo?')) { S = { eventos: [], contexto: {}, ajustes: S.ajustes }; save(); render(); toast('Datos borrados'); } break;
      }
    });
    document.addEventListener('change', ev => {
      const t = ev.target;
      if (t.dataset && t.dataset.field && ui.sheetId) {
        const e = evById(ui.sheetId); if (!e) return; const k = t.dataset.field;
        if (k === 'hora' || k === 'horaFin') { if (t.value) e[k] = t.value; else if (k === 'horaFin') e[k] = ''; }
        else e[k] = t.value;
        normalizeEv(e); save(); render();
      }
    });
    document.getElementById('fileIn').addEventListener('change', function () {
      const file = this.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const txt = String(rd.result); let added = 0, updated = 0;
          if (/\.json$/i.test(file.name) || txt.trim().startsWith('{')) {
            const data = JSON.parse(txt);
            if (data.eventos) { for (const e of data.eventos) { if (!e || !e.fecha || !e.hora) continue; const ex = evById(e.id); if (ex) { Object.assign(ex, e); updated++; } else { S.eventos.push(e); added++; } } }
            if (data.contexto) { for (const f of Object.keys(data.contexto)) { S.contexto[f] = Object.assign({}, S.contexto[f], data.contexto[f]); } }
          } else {
            const evs = parseCSV(txt);
            for (const e of evs) { const ex = evById(e.id); if (ex) { Object.assign(ex, e); updated++; } else { S.eventos.push(e); added++; } }
          }
          save(); render(); toast('Importado: ' + added + ' nuevos, ' + updated + ' actualizados ✓');
        } catch (err) { toast('No se pudo leer el archivo'); }
        this.value = '';
      };
      rd.readAsText(file, 'utf-8');
    });
    document.getElementById('sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap') { ui.sheetId = null; render(); } });
    document.getElementById('modalWrap').addEventListener('click', e => { if (e.target.id === 'modalWrap') { ui.modal = null; ui.parseRows = null; renderModal(); } });
    render();
  </script>
